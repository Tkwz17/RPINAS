name: Build RPINAS Images

on:
  push:
    branches: [ main, MAIN ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.model.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model:
          - name: Raspberry Pi 3
            artifact: rpinas-raspberry-pi-3-bookworm-image
            output: rpinas-raspberry-pi-3-bookworm.img
            base_image: https://downloads.raspberrypi.com/raspios_lite_armhf/images/raspios_lite_armhf-2024-11-19/2024-11-19-raspios-bookworm-armhf-lite.img.xz
            env_file: rpi-image-gen/rpinas-pi3.env
            image_additional_mb: 768
            boot_config: |
              # RPINAS Pi 3 tuning: 32-bit userspace, minimal GPU memory, NAS-focused radios.
              [pi3]
              arm_64bit=0
              gpu_mem=16
              dtoverlay=disable-bt
              [all]
          - name: Raspberry Pi 4
            artifact: rpinas-raspberry-pi-4-bookworm-image
            output: rpinas-raspberry-pi-4-bookworm.img
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-11-19/2024-11-19-raspios-bookworm-arm64-lite.img.xz
            env_file: rpi-image-gen/rpinas-pi4.env
            image_additional_mb: 1024
            boot_config: |
              # RPINAS Pi 4 tuning: 64-bit userspace with low GPU memory for headless NAS use.
              [pi4]
              arm_64bit=1
              gpu_mem=32
              dtoverlay=disable-bt
              [all]
          - name: Raspberry Pi 5
            artifact: rpinas-raspberry-pi-5-bookworm-image
            output: rpinas-raspberry-pi-5-bookworm.img
            base_image: https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2024-11-19/2024-11-19-raspios-bookworm-arm64-lite.img.xz
            env_file: rpi-image-gen/rpinas-pi5.env
            image_additional_mb: 1536
            boot_config: |
              # RPINAS Pi 5 tuning: 64-bit userspace, low GPU memory, and PCIe enabled for NVMe/HAT storage.
              [pi5]
              arm_64bit=1
              gpu_mem=32
              dtparam=pciex1
              [all]
    steps:
      - name: Checkout RPINAS repo
        uses: actions/checkout@v4

      - name: Build custom Raspberry Pi OS image
        id: build_image
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: ${{ matrix.model.base_image }}
          image_additional_mb: ${{ matrix.model.image_additional_mb }}
          commands: |
            set -eu

            apt-get update
            xargs -r -a rpi-image-gen/packages/rpinas.list apt-get install -y

            install -d /opt/rpinas-src /usr/local/bin /etc/systemd/system /etc/default
            cp -r backend /opt/rpinas-src/backend

            install -m 0755 scripts/first_boot.sh /usr/local/bin/rpinas-first-boot
            install -m 0755 scripts/network_setup.sh /usr/local/bin/rpinas-network-setup
            install -m 0755 scripts/samba_setup.sh /usr/local/bin/rpinas-samba-setup
            install -m 0755 scripts/install_backend.sh /usr/local/bin/rpinas-install-backend
            install -m 0644 "${{ matrix.model.env_file }}" /etc/default/rpinas

            install -m 0644 systemd/rpinas-backend.service /etc/systemd/system/rpinas-backend.service
            install -m 0644 systemd/rpinas-firstboot.service /etc/systemd/system/rpinas-firstboot.service
            install -m 0644 systemd/rpinas-network-setup.service /etc/systemd/system/rpinas-network-setup.service
            install -m 0644 systemd/rpinas-samba-setup.service /etc/systemd/system/rpinas-samba-setup.service

            boot_config_path=/boot/firmware/config.txt
            if [ ! -f "$boot_config_path" ]; then
              boot_config_path=/boot/config.txt
            fi
            cat >> "$boot_config_path" <<'RPINAS_BOOT_CONFIG'
            ${{ matrix.model.boot_config }}
            RPINAS_BOOT_CONFIG

            /usr/local/bin/rpinas-install-backend

            systemctl enable rpinas-firstboot.service rpinas-network-setup.service \
              rpinas-samba-setup.service rpinas-backend.service

      - name: Compress image
        run: |
          set -eu
          mv "${{ steps.build_image.outputs.image }}" "${{ matrix.model.output }}"
          xz -0 -T 0 -v "${{ matrix.model.output }}"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model.artifact }}
          path: ${{ matrix.model.output }}.xz
          if-no-files-found: error
